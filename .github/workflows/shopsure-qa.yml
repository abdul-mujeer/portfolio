name: ShopSure QA

on:
  push:
    branches: [main]
    paths:
      - "projects/shopsure-qa/**"
      - ".github/workflows/shopsure-qa.yml"
  pull_request:
    paths:
      - "projects/shopsure-qa/**"
      - ".github/workflows/shopsure-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopsure-qa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/shopsure-qa

jobs:
  test:
    name: Lint, build and run all suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/shopsure-qa/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the storefront SPA
        run: npm run build

      - name: Regenerate the CSV deliverables from the test-case sources
        run: npm run docs:csv

      - name: Run every suite and build the execution report
        run: npm run test:all

      - name: Prove the seeded-defect detection still works
        run: npm run test:seeded-defects
        # The script runs the suites twice: with SEED_DEFECTS=1 it must fail (detection works) and
        # with SEED_DEFECTS=0 it must pass. It exits 0 only for that exact contrast, so this step is
        # a genuine gate rather than a decorative run.

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopsure-qa-reports
          path: |
            projects/shopsure-qa/test-reports/
            projects/shopsure-qa/test-evidence/
          if-no-files-found: warn
          retention-days: 30
