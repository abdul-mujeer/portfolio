name: PeopleCore QA

on:
  push:
    branches: [main]
    paths:
      - "projects/peoplecore-qa/**"
      - ".github/workflows/peoplecore-qa.yml"
  pull_request:
    paths:
      - "projects/peoplecore-qa/**"
      - ".github/workflows/peoplecore-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peoplecore-qa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/peoplecore-qa

jobs:
  test:
    name: Lint and run all suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/peoplecore-qa/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Regenerate the CSV deliverables from the test-case sources
        run: npm run docs:csv

      - name: Run every suite and build the execution report
        run: npm run test:all

      - name: Upload test reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peoplecore-qa-reports
          path: |
            projects/peoplecore-qa/test-reports/
            projects/peoplecore-qa/test-evidence/
          if-no-files-found: warn
          retention-days: 30
